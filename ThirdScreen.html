@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');


*{
    box-sizing:border-box;
}


body{

    margin:0;

    height:100vh;

    background:#000;

    display:flex;

    justify-content:center;

    align-items:center;

    font-family:'Press Start 2P', monospace;

}



/* ОБЩИЙ ЭКРАН */

.transition-heart{

    position:absolute;

    pointer-events:none;

    z-index:250;

}
#fadeScreen{

    position:absolute;
    inset:0;

    background:#000;

    opacity:0;

    pointer-events:none;

    transition:opacity 2.5s linear;

    z-index:9999;

}

#fadeScreen.show{

    opacity:1;

}

.game{


    width:900px;

    height:600px;


    position:relative;


    overflow:hidden;


    border:8px solid white;


    box-shadow:

    0 0 0 8px #333,

    0 0 40px black;


}



/* ===========================
   ИГРА НА ФОНЕ
=========================== */


#battleLayer{


    position:absolute;

    inset:0;


    z-index:1;


    background:

    linear-gradient(

        135deg,

        #ffd6e8,

        #fff0c9

    );


    overflow:hidden;


}



/* ===========================
   ДИАЛОГ ПОВЕРХ ИГРЫ
=========================== */



/* ПОРТРЕТЫ */


.character{


    position:absolute;


    bottom:170px;


    width:270px;

    height:270px;


    display:flex;


    align-items:end;

    justify-content:center;


    opacity:.35;


    transition:.25s;


}



.character.active{


    opacity:1;


    transform:translateY(-12px);


}




.character img{


    max-width:100%;

    max-height:100%;


    image-rendering:pixelated;


}



.left{

    left:30px;

}



.right{

    right:30px;

}



.right img{

    transform:scaleX(-1);

}





/* ОКНО ДИАЛОГА */


.dialogue{


    position:absolute;


    left:35px;

    right:35px;

    bottom:35px;


    min-height:160px;


    background:#101848;


    border:6px solid white;


    box-shadow:


    inset 0 0 0 4px #555,


    0 0 0 4px black;


    padding:35px;


    color:white;


    pointer-events:auto;


}

#dialogLayer{

    position:absolute;

    inset:0;

    z-index:20;

    pointer-events:none;

    transition:transform .6s ease, opacity .6s ease;

}


#dialogLayer.hide{

    transform:translateY(650px);

    opacity:0;

}




/* ИМЯ */


.name{


    position:absolute;


    top:-38px;


    left:25px;


    padding:12px 25px;


    background:#222;


    border:5px solid white;


    color:#ffe680;


    font-size:16px;


}





/* ТЕКСТ */


.text{

    line-height:1.8;


    text-shadow:

    3px 3px #000;


}






.next{


    position:absolute;


    right:25px;


    bottom:15px;


    animation:blink 1s infinite;


}



@keyframes blink{


    50%{

        opacity:0;

    }

}




.hint{


    position:absolute;


    bottom:5px;


    width:100%;


    text-align:center;


    color:#aaa;


    font-size:10px;

   ЭЛЕМЕНТЫ ИГРЫ
   (сюда придут коты/пчёлы)
=========================== */



.cat{

    position:absolute;

    font-size:55px;

    will-change:transform;

}



.bee{


    position:absolute;


    font-size:32px;


}



.object{


    position:absolute;


    font-size:45px;


}

#timer{

    position:absolute;

    top:25px;

    left:35px;

    display:flex;

    align-items:center;

    gap:8px;

    color:white;

    text-shadow:
    3px 3px #000;

    z-index:5;

    animation:timerPulse 1s infinite;

}


.timer-icon{

    font-size:38px;

    line-height:1;

    display:block;

}


#timerValue{

    font-size:32px;

    line-height:1;

    display:block;

    position:relative;

    top:6px;

}



@keyframes timerPulse{

    0%{

        transform:scale(1);

    }


    50%{

        transform:scale(1.15);

    }


    100%{

        transform:scale(1);

    }

}

@keyframes pop {

    0%{
        transform:scale(1);
        opacity:1;
    }

    40%{
        transform:scale(1.35) rotate(12deg);
    }

    100%{
        transform:scale(.1) rotate(45deg);
        opacity:0;
    }

}

@keyframes shard {

    from{
        transform:translate(0,0) scale(1);
        opacity:1;
    }

    to{
        transform:
            translate(var(--dx),var(--dy))
            rotate(360deg)
            scale(.3);
        opacity:0;
    }

}

.particle{

    position:absolute;
    pointer-events:none;
    font-size:18px;
    animation:shard .55s forwards;

}

.overlay{

    position:absolute;
    inset:0;

    display:flex;
    justify-content:center;
    align-items:center;

    background:rgba(0,0,0,.75);

    z-index:100;

    opacity:0;
    pointer-events:none;

    transition:.3s;

}

.overlay.show{

    opacity:1;
    pointer-events:auto;

}

.overlay-box{

    background:#101848;

    border:6px solid white;

    box-shadow:
        inset 0 0 0 4px #555,

    text-align:center;

    color:white;

    margin-bottom:35px;

    border:4px solid white;

    cursor:pointer;

#retryButton:hover{

}

.cry-cat{

    font-size:55px;

    display:inline-block;

    vertical-align:middle;

    animation:cryShake .8s infinite;

}


@keyframes cryShake{

    0%{

    }

    50%{

    }

    100%{

    }

}

#winScreen,
#storyEnd{

#kissButton,
#continueButton{

    background:#ffe680;

    border:4px solid white;

    cursor:pointer;

.heart{

    font-size:35px;

    pointer-events:none;

    animation:heartFly 2s forwards;

}



@keyframes heartFly{

    from{

        transform:translate(0,0) scale(1);

        opacity:1;

    }


    to{

        transform:
        translate(
        calc(var(--x)),
        calc(var(--y))
        )
        scale(.2);

        opacity:0;

    }

}



.loveJump{

    animation:jump .5s infinite alternate;

}



@keyframes jump{

    }

    to{

    }

#happyCat{

    top:300px;

.big-heart{

    font-size:55px;

@keyframes heartBeat{

    0%{

    }

    50%{
        transform:scale(1.15);
    }

    100%{
        transform:scale(1);
    }

}

.transition-heart{

    position:absolute;

    pointer-events:none;

    z-index:300;

}

</style>

function fadeMusic(from, to, duration = 1000){

    const steps = 30;
    const interval = duration / steps;

    let current = 0;

    const fromStart = from.volume;
    const toStart = to.volume;

    to.play().catch(()=>{});


    let timer = setInterval(()=>{

        current++;

        let progress = current / steps;


        from.volume = Math.max(
            0,
            fromStart * (1-progress)
        );


        to.volume =
            Math.min(
                0.25,
                toStart + progress * 0.25
            );


        if(current >= steps){

            clearInterval(timer);

            from.pause();
            from.currentTime = 0;

            to.volume = 0.25;

        }


    }, interval);

}

		if (dist > 0) {

			b.wobble += 0.25;

			const nx = dx / dist;
			const ny = dy / dist;

			// Перпендикуляр к направлению
			const px = -ny;
			const py = nx;

			// Сила виляния
			const wobble = Math.sin(b.wobble) * 2.5;

			b.x += nx * 1.6 + px * wobble;
			b.y += ny * 1.6 + py * wobble;
		}

		} else {

			b.angle += 0.05;

			b.x += Math.cos(b.angle) * 1.5;
			b.y += Math.sin(b.angle) * 1.5;

		}


    b.style.left = b.x + "px";
    b.style.top = b.y + "px";


    if(dist < 45){

        loseGame();

    }

});

}

// ПОБЕДА
// ===============================


function winGame(){

    running=false;

    finalScene=true;

    battleStarted=false;


	switchMusic(winMusic);


    startFinalScene();

}

const MUSIC_VOLUME = 0.25;

[
    bgm,
    winMusic,
    loveMusic
].forEach(a=>{

    a.volume = 0;
    a.loop = true;

});

let currentMusic = bgm;

bgm.volume = MUSIC_VOLUME;

function switchMusic(next, duration = 1500){

    if(currentMusic === next)
        return;

    next.currentTime = 0;
    next.volume = 0;
    next.play().catch(()=>{});

    const interval = 50;
    const steps = duration / interval;

    let step = 0;

    const from = currentMusic;

    const timer = setInterval(()=>{

        step++;

        const p = step / steps;

        if(from){

            from.volume =
                MUSIC_VOLUME * (1 - p);

        }

        next.volume =
            MUSIC_VOLUME * p;

        if(step >= steps){

            clearInterval(timer);

            if(from){

                from.pause();
                from.currentTime = 0;
                from.volume = 0;

            }

            next.volume = MUSIC_VOLUME;
            currentMusic = next;

        }

    },interval);

}

function setCatPosition(element,x,y){

    element.style.left =
    (x - element.offsetWidth / 2) + "px";

    element.style.top =
    (y - element.offsetHeight / 2) + "px";

}

function startFinalScene(){


    // пчёлы улетают

    bees.forEach(b=>{

        let angle=Math.random()*Math.PI*2;

        b.escapeVX=Math.cos(angle)*8;
        b.escapeVY=Math.sin(angle)*8;

        b.flyAway=true;

    });



    // ставим счастливого кота за экраном

	happyX = happyStart.x;
	happyY = happyStart.y;

	setCatPosition(
		heroCat,
		happyX,
		happyY
	);



    // возвращаем плачущего кота
    // в игровую позицию

	catRunningX = catX + cat.offsetWidth / 2;
	catRunningY = catY + cat.offsetHeight / 2;

	cryingTarget.x = happyTarget.x - 200;
	cryingTarget.y = happyTarget.y;

    finalPhase=0;


    requestAnimationFrame(finalAnimation);

}

function finalAnimation(){


/*
=====================
ФАЗА 1
ПЧЁЛЫ УЛЕТАЮТ
=====================
*/


if(finalPhase===0){


    let gone=true;


    bees.forEach(b=>{


        b.x+=b.escapeVX;
        b.y+=b.escapeVY;


        b.style.left=b.x+"px";
        b.style.top=b.y+"px";


        if(
            b.x>-100 &&
            b.x<1000 &&
            b.y>-100 &&
            b.y<700
        ){

            gone=false;
updateBattle
        }

    });



    if(gone){

        finalPhase=1;

    }


    requestAnimationFrame(finalAnimation);

    return;

}





/*
=====================
ФАЗА 2
УСМЕХАЮЩИЙСЯ КОТ БЕЖИТ
=====================
*/


if(finalPhase===1){

    let happyDx = happyTarget.x - happyX;


    if(Math.abs(happyDx)>3){

        happyX += happyDx * 0.02;

    }
    else{

        happyX = happyTarget.x;

    }


    setCatPosition(
        heroCat,
        happyX,
        happyY
    );



    let cryDx = cryingTarget.x - catRunningX;
    let cryDy = cryingTarget.y - catRunningY;


    let cryDistance = Math.sqrt(
        cryDx*cryDx + cryDy*cryDy
    );


    if(cryDistance>3){

        catRunningX += cryDx * 0.02;
        catRunningY += cryDy * 0.02;

    }
    else{

        catRunningX = cryingTarget.x;
        catRunningY = cryingTarget.y;

    }


    setCatPosition(
        cat,
        catRunningX,
        catRunningY
    );



    // оба дошли
    if(
        Math.abs(happyX-happyTarget.x)<3 &&
        cryDistance<3
    ){

        finalPhase=3;

    }


    requestAnimationFrame(finalAnimation);

    return;

}




/*
=====================
ФАЗА 4
СТОЯТ РЯДОМ
=====================
*/


if(finalPhase===3){

    setCatPosition(
        cat,
        cryingTarget.x,
        cryingTarget.y
    );

    setCatPosition(
        heroCat,
        happyTarget.x,
        happyTarget.y
    );
	
    cat.innerHTML="🙀";

    heroCat.innerHTML="😼";


    createHearts();


    showWinWindow();


    finalPhase=4;


}

}

        });


        battleLayer.appendChild(h);


        setTimeout(()=>h.remove(),1500);

    }

}

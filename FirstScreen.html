<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Привет, котичка ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


body{

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    overflow:hidden;

    font-family:'Comfortaa', sans-serif;

    background:
    linear-gradient(-45deg,
    #ffd6e8,
    #ffeec2,
    #ffd9f5,
    #fff4d6);

    background-size:400% 400%;

    animation:bg 15s ease infinite;

}



@keyframes bg{

    0%{
        background-position:0 50%;
    }

    50%{
        background-position:100% 50%;
    }

    100%{
        background-position:0 50%;
    }

}



/* Затемнение перед переходом */

.fade-screen{

    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:100%;

    background:#000;

    opacity:0;

    pointer-events:none;

    transition:opacity 1.5s ease;

    z-index:100;

}


.fade-screen.active{

    opacity:1;

}



/* Карточка */

.container{

    width:90%;
    max-width:600px;

    padding:45px 35px;

    text-align:center;

    background:rgba(255,255,255,.45);

    backdrop-filter:blur(20px);

    border-radius:35px;

    box-shadow:0 20px 60px rgba(0,0,0,.15);

    opacity:0;
    transform:translateY(35px) scale(.97);

    transition:1.5s ease;

}

.container.show{

    opacity:1;
    transform:translateY(0) scale(1);

}







/* Заголовок */

h1{

    color:#ff4f81;

    font-size:2.8rem;

    margin-bottom:25px;

    text-shadow:
    0 4px 10px rgba(255,79,129,.25);

}



/* Котик */

img{

    width:320px;

    max-width:90%;


    border-radius:25px;


    box-shadow:
    0 15px 35px rgba(0,0,0,.2);


    transition:.5s;

}


img:hover{

    transform:
    scale(1.05)
    rotate(-2deg);

}



/* Эмодзи */

.emoji{

    font-size:3rem;

    margin-top:20px;

    animation:bounce 2s infinite;

}



@keyframes bounce{

    50%{

        transform:translateY(-10px);

    }

}



/* Текст */

.next{

    margin-top:55px;

}



.line{

    opacity:0;

    transform:translateY(20px);


    transition:1s;


    margin-bottom:18px;


    color:#ff4f81;


    font-size:1.25rem;


    font-weight:bold;

}



.line.show{

    opacity:1;

    transform:translateY(0);

}



/* Сердце */


.heart-block{

    opacity:0;

    margin-top:40px;


    transition:2s;

}


.heart-block.show{

    opacity:1;

}



.heart{

    display:inline-block;


    font-size:5rem;


    cursor:pointer;


    user-select:none;


    animation:heartBeat 1.3s infinite;

}



@keyframes heartBeat{


    0%,100%{

        transform:scale(1);

    }


    50%{

        transform:scale(1.25);

    }

}



.heart-text{

    margin-top:15px;


    color:#ff4f81;


    font-weight:bold;


    font-size:1.2rem;

}



/* Фоновые сердечки */


.floating-heart{

    position:fixed;


    bottom:-30px;


    color:#ff7ca8;


    opacity:.7;


    pointer-events:none;


    animation:fly 8s linear infinite;

}



@keyframes fly{


    from{

        transform:
        translateY(0)
        scale(.7);

    }


    to{

        transform:
        translateY(-110vh)
        scale(1.5);


        opacity:0;

    }

}



/* Сердечки после клика */


.click-heart{

    position:fixed;


    bottom:-50px;


    pointer-events:none;


    z-index:20;


    animation:riseHeart linear forwards;

}



@keyframes riseHeart{


    0%{

        transform:

        translateY(0)

        scale(.5)

        rotate(0deg);


        opacity:1;

    }


    100%{

        transform:

        translateY(-120vh)

        scale(1.5)

        rotate(360deg);


        opacity:0;

    }

}


</style>

</head>

<body>


<!-- Затемнение перед переходом -->

<div class="fade-screen"></div>



<div class="container">


<h1>
Привет, котичка! ❤️
</h1>



<img src="https://cataas.com/cat/cute" alt="Котик">



<div class="emoji">
😺
</div>




<div class="next">


<p class="line">
Сегодня у тебя особенный день!
</p>



<p class="line">
У меня есть для тебя подарок 🎁
</p>



<p class="line">
Но чтобы его получить, придется пройти небольшое приключение 😉
</p>



<p class="line">
Тебе точно понравится!
</p>



<p class="line">
Ну что, готова? ❤️
</p>





<div class="heart-block">


<div class="heart">
❤️
</div>



<p class="heart-text">
Нажми на сердечко!
</p>



</div>



</div>


</div>


<audio id="bgMusic" loop>

    <source src="music/first.mp3">

</audio>


<script>


// Плавное появление текста


setTimeout(()=>{


const lines=document.querySelectorAll(".line");

const heartBlock=document.querySelector(".heart-block");



lines.forEach((line,index)=>{


setTimeout(()=>{


line.classList.add("show");


},index*1800);



});



setTimeout(()=>{


heartBlock.classList.add("show");


},lines.length*1800+1000);



},1800);








// Фоновые сердечки


setInterval(()=>{


let heart=document.createElement("div");


heart.className="floating-heart";


heart.innerHTML="❤️";



heart.style.left=
Math.random()*100+"vw";



heart.style.fontSize=
(15+Math.random()*25)+"px";



heart.style.animationDuration=
(5+Math.random()*5)+"s";



document.body.appendChild(heart);



setTimeout(()=>{


heart.remove();



},9000);



},700);









// Нажатие на сердце
const music=document.getElementById("bgMusic");

const container=document.querySelector(".container");

let started=false;

function fadeOutMusic(duration = 2000) {

    const interval = 50;
    const step = music.volume / (duration / interval);

    const fade = setInterval(() => {

        if (music.volume > step) {
            music.volume -= step;
        } else {
            music.volume = 0;
            clearInterval(fade);
        }

    }, interval);

}


setTimeout(()=>{

    container.classList.add("show");

},300);

window.addEventListener("load",()=>{


    if(localStorage.getItem("audioUnlocked")==="true"){

        music.volume=0.25;


        music.play().catch(()=>{

            console.log("Автовоспроизведение запрещено браузером");

        });


    }


});


document.querySelector(".heart").onclick=()=>{


if(started) return;


started=true;



// Сердечки снизу после клика


setInterval(()=>{


let heart=document.createElement("div");


heart.className="click-heart";



heart.innerHTML=[

"❤️",
"💖",
"💕",
"💗",
"💓"

][Math.floor(Math.random()*5)];



heart.style.left=
Math.random()*100+"vw";



heart.style.fontSize=
(20+Math.random()*45)+"px";



heart.style.animationDuration=
(3+Math.random()*4)+"s";



document.body.appendChild(heart);




setTimeout(()=>{


heart.remove();



},7000);



},150);








// Через 3 секунды начинаем плавно глушить музыку
setTimeout(() => {

    fadeOutMusic(1500);

    document
        .querySelector(".fade-screen")
        .classList.add("active");

}, 3000);







// Переход на второй экран


setTimeout(()=>{


window.location.href="SecondScreen.html";



},4500);



};

</script>


</body>

</html>
